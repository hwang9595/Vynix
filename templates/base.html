{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf" content="{{ csrf_token }}">
  <title>{% block title %}Vynix{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="topbar">
    <a href="{% url 'home:index' %}" class="logo">♪ Vynix</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'player:playlist_create' %}" class="btn">+ Плейлист</a>
        <span class="muted">{{ user.username }}</span>
        <form method="post" action="{% url 'users:logout' %}" class="inline">
          {% csrf_token %}
          <button class="link">Выйти</button>
        </form>
      {% else %}
        <a href="{% url 'users:login' %}">Войти</a>
        <a href="{% url 'users:register' %}" class="btn">Регистрация</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="player">
    <img id="p-cover" class="p-cover" alt="">
    <div class="p-meta">
      <b id="p-title">Выбери трек</b>
      <span id="p-artist"></span>
    </div>
    <div class="p-controls">
      <button id="p-prev">⏮</button>
      <button id="p-play">▶</button>
      <button id="p-next">⏭</button>
    </div>
    <span id="p-time">0:00</span>
    <input id="p-seek" type="range" min="0" max="100" value="0">
    <input id="p-vol" type="range" min="0" max="1" step="0.05" value="0.8">
  </footer>

  <script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
